name: Daily Job Search

on:
  schedule:
    - cron: "30 3 * * *"
  workflow_dispatch:

concurrency:
  group: daily-job-search
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Validate database configuration
        env:
          DATABASE_URL: ${{ secrets.APPLICATION_DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::Missing APPLICATION_DATABASE_URL repository secret."
            exit 1
          fi

      - name: Run safe discovery pipeline
        id: discovery
        env:
          JOB_SEARCH_ENABLED: ${{ secrets.JOB_SEARCH_ENABLED }}
          JOB_SEARCH_MAX_RESULTS: ${{ secrets.JOB_SEARCH_MAX_RESULTS }}
          MIN_COMPENSATION_INR: ${{ secrets.MIN_COMPENSATION_INR }}
          JOB_PROVIDER_BOARDS: ${{ secrets.JOB_PROVIDER_BOARDS || '{"greenhouse":["monks"],"lever":["acceldata","hevodata","brillio-2","everbridge","weekdayworks"]}' }}
          DATABASE_URL: ${{ secrets.APPLICATION_DATABASE_URL }}
        run: python -m src.main

      - name: Write daily job summary
        if: always()
        env:
          DISCOVERY_OUTCOME: ${{ steps.discovery.outcome }}
        run: |
          if [ -f data/run-metrics.json ]; then
            JOBS_FOUND=$(python -c "import json; print(json.load(open('data/run-metrics.json'))['jobs_found'])")
            MATCHING_JOBS=$(python -c "import json; print(json.load(open('data/run-metrics.json'))['matching_jobs'])")
            PREPARED=$(python -c "import json; print(json.load(open('data/run-metrics.json'))['applications_prepared'])")
            SUBMITTED=$(python -c "import json; print(json.load(open('data/run-metrics.json'))['applications_submitted'])")
            ERRORS=$(python -c "import json; print(json.load(open('data/run-metrics.json'))['errors'])")
          else
            JOBS_FOUND=0; MATCHING_JOBS=0; PREPARED=0; SUBMITTED=0; ERRORS=1
          fi
          if [ "$DISCOVERY_OUTCOME" != "success" ]; then ERRORS=$((ERRORS + 1)); fi
          {
            echo "## AI Job Agent — Daily Summary"
            echo ""
            echo "| Metric | Count |"
            echo "|---|---:|"
            echo "| Jobs found | $JOBS_FOUND |"
            echo "| Matching jobs | $MATCHING_JOBS |"
            echo "| Applications prepared | $PREPARED |"
            echo "| Applications submitted | $SUBMITTED |"
            echo "| Errors | $ERRORS |"
            echo ""
            echo "> Candidate profile is loaded privately from Supabase; no profile answers are stored in Git."
            echo "> External application submission remains approval-gated."
          } >> "$GITHUB_STEP_SUMMARY"
