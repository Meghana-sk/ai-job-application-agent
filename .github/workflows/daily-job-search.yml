name: Daily Job Search

on:
  schedule:
    - cron: "30 3 * * *"
  workflow_dispatch:

concurrency:
  group: daily-job-search
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  discover:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate private history key
        env:
          APPLICATION_HISTORY_KEY: ${{ secrets.APPLICATION_HISTORY_KEY }}
        run: |
          if [ -z "$APPLICATION_HISTORY_KEY" ]; then
            echo "::error::Missing APPLICATION_HISTORY_KEY repository secret."
            echo "Create a random key locally and add it as a GitHub Actions repository secret."
            exit 1
          fi

      - name: Restore encrypted application history
        env:
          GH_TOKEN: ${{ github.token }}
          APPLICATION_HISTORY_KEY: ${{ secrets.APPLICATION_HISTORY_KEY }}
        run: |
          set -euo pipefail
          mkdir -p .runtime data

          ARTIFACT_ID=$(gh api             "/repos/$GITHUB_REPOSITORY/actions/artifacts?name=application-history&per_page=100"             --jq '.artifacts | sort_by(.created_at) | last | .id // empty')

          if [ -z "$ARTIFACT_ID" ]; then
            echo "No previous application history artifact found. Starting a new private tracker."
            exit 0
          fi

          echo "Restoring latest encrypted application history."
          gh api             --output .runtime/history.zip             "/repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID/zip"

          unzip -q .runtime/history.zip -d .runtime/history
          test -f .runtime/history/application-history.enc

          openssl enc -d -aes-256-cbc -pbkdf2             -in .runtime/history/application-history.enc             -out data/applications.sqlite3             -pass env:APPLICATION_HISTORY_KEY

          chmod 600 data/applications.sqlite3

      - name: Run safe discovery pipeline
        id: discovery
        env:
          JOB_SEARCH_ENABLED: ${{ secrets.JOB_SEARCH_ENABLED }}
          JOB_SEARCH_MAX_RESULTS: ${{ secrets.JOB_SEARCH_MAX_RESULTS }}
        run: python -m src.main

      - name: Write daily job summary
        if: always()
        env:
          DISCOVERY_OUTCOME: ${{ steps.discovery.outcome }}
        run: |
          if [ -f data/run-metrics.json ]; then
            JOBS_FOUND=$(python -c "import json; print(json.load(open('data/run-metrics.json'))['jobs_found'])")
            MATCHING_JOBS=$(python -c "import json; print(json.load(open('data/run-metrics.json'))['matching_jobs'])")
            PREPARED=$(python -c "import json; print(json.load(open('data/run-metrics.json'))['applications_prepared'])")
            SUBMITTED=$(python -c "import json; print(json.load(open('data/run-metrics.json'))['applications_submitted'])")
            ERRORS=$(python -c "import json; print(json.load(open('data/run-metrics.json'))['errors'])")
          else
            JOBS_FOUND=0
            MATCHING_JOBS=0
            PREPARED=0
            SUBMITTED=0
            ERRORS=1
          fi

          if [ "$DISCOVERY_OUTCOME" != "success" ]; then
            ERRORS=$((ERRORS + 1))
          fi

          {
            echo "## AI Job Agent — Daily Summary"
            echo ""
            echo "| Metric | Count |"
            echo "|---|---:|"
            echo "| Jobs found | $JOBS_FOUND |"
            echo "| Matching jobs | $MATCHING_JOBS |"
            echo "| Applications prepared | $PREPARED |"
            echo "| Applications submitted | $SUBMITTED |"
            echo "| Errors | $ERRORS |"
            echo ""
            echo "> Application history is encrypted before it is stored as a workflow artifact."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Persist encrypted application history
        if: always() && hashFiles('data/applications.sqlite3') != ''
        env:
          APPLICATION_HISTORY_KEY: ${{ secrets.APPLICATION_HISTORY_KEY }}
        run: |
          set -euo pipefail
          rm -rf .runtime/history-out
          mkdir -p .runtime/history-out

          openssl enc -aes-256-cbc -pbkdf2             -salt             -in data/applications.sqlite3             -out .runtime/history-out/application-history.enc             -pass env:APPLICATION_HISTORY_KEY

          chmod 600 .runtime/history-out/application-history.enc
          rm -f data/applications.sqlite3

      - name: Upload encrypted application history
        if: always() && hashFiles('.runtime/history-out/application-history.enc') != ''
        uses: actions/upload-artifact@v4
        with:
          name: application-history
          path: .runtime/history-out/application-history.enc
          if-no-files-found: error
          retention-days: 90
          overwrite: true
