name: Daily Job Search

on:
  schedule:
    - cron: "30 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run safe discovery pipeline
        env:
          JOB_SEARCH_ENABLED: ${{ secrets.JOB_SEARCH_ENABLED }}
          JOB_SEARCH_MAX_RESULTS: ${{ secrets.JOB_SEARCH_MAX_RESULTS }}
        run: python -m src.main
